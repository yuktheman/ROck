<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css" />


</head>

<body>

  <div class="game">
    <main class="main">score board</main>
    <h1>Rock Paper Scissors</h1>

    <div class="players">
      <div class="player">
        <h3>You</h3>
        <div class="choice-display user-choice" id="hell">

        </div>
      </div>

      <div class="vs">VS</div>

      <div class="player">
        <h3>Computer</h3>
        <div class="choice-display computer-choice" id="hell2">
   
        
        </div>
      </div>
    </div>

    <div class="choices">
      <button class="choicerock">
   <img src="fist.png"  width="100px" height="50px">
      </button>
      <button class="choicePaper" >

    <img src="hand-paper.png"  width="100px" height="50px">
    
      </button>
      <button class="choiceScissors">
       <img src="scissors.png"  width="100px" height="50px">
      </button>
    </div>

    <p class="result-text">Choose your move </p>
  </div>
<script src="script.js"></script>

</body>
</html>
